# Everything secret comes from environment variables (hosting) or a local.properties file (your laptop).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disaster_relief?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=${PORT:8080}
server.servlet.session.timeout=60m
server.forward-headers-strategy=framework

resend.api-key=${RESEND_API_KEY:}
resend.to=${RESEND_TO:}
app.admin-password=${ADMIN_PASSWORD:admin123}

# Local-only overrides (git-ignored): put your own password and keys in ./local.properties
spring.config.import=optional:file:./local.properties
